# ==========================================
# General Settings
# ==========================================

# Remap prefix from 'Ctrl+b' to 'Ctrl+a'
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable mouse support (clickable windows, panes, and resizable borders)
set -g mouse on

# Increase scrollback history limit
set -g history-limit 10000

# Start window and pane numbering at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Optional: Ensure tmux passes through true colors and mouse control for Micro
set -g default-terminal "tmux-256color"
set -g mouse on

# ==========================================
# Key Bindings
# ==========================================

# Dynamic config reload
bind r run-shell 'tmux source-file ~/.config/tmux/tmux.conf && tmux display-message "Config reloaded!"'

# Split panes using \ and - (more intuitive than % and ")
# Opens new panes in the current working directory
bind "\\" split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Open new windows in current working directory
bind c new-window -c "#{pane_current_path}"

# Switch panes using Alt + Arrow keys without needing the prefix key
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# ==========================================
# Visual / Status Bar Setup
# ==========================================

# Minimal status bar style
set -g status-style bg=default,fg=colour8
set -g status-left-length 40
set -g status-left "#[fg=green,bold]#S #[default]"
set -g status-right "#[fg=yellow]%H:%M #[fg=blue]%d-%b-%y"
set -g window-status-current-style fg=cyan,bold

# ==========================================
# TPM & Plugins Configuration
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'

# Resurrect & Continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'

# Tmux-Thumbs Configuration (Use lowercase 'space')
set -g @thumbs-key space
set -g @thumbs-command 'echo -n {} | pbcopy'
set -g @thumbs-up-after-compilation true

# Auto-Install TPM, Fetch Plugins & Compile tmux-thumbs on New Systems
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && \
        ~/.tmux/plugins/tpm/bin/install_plugins ~/.config/tmux/tmux.conf && \
        cd ~/.tmux/plugins/tmux-thumbs && (cargo build --release || sh tmux-thumbs-install.sh)'"

# Initialize TPM (Keep at the absolute bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

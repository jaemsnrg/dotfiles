# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts for readability
add_newline = true

# Define two-line format:
# Line 1: Directory, Git, Runtimes, Container status, Execution time
# Line 2: Character prompt
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# Input character settings
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

# Directory formatting
[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"

# Show command duration if it takes longer than 2 seconds
[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow) "

# Git branch & status styling
[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
format = '([$all_status$ahead_behind]($style)) '

# Node.js module (useful for JS/TS projects)
[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"

# Package module (hides package version by default to keep prompt clean)
[package]
disabled = true

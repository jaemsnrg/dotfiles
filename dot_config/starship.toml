"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true

# Standard newline between line 1 (info) and line 2 (prompt character)
format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$cmd_duration
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[directory]
truncation_length = 3
style = "bold cyan"

[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow) "
